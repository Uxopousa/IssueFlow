<a
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-3 focus:text-slate-950 focus:shadow-lg focus:outline focus:outline-2 focus:outline-indigo-700"
  href="#main-content"
>
  Saltar al contenido
</a>

<div class="flex min-h-screen flex-col bg-slate-50 text-slate-950">
  <header class="border-b border-slate-200 bg-white">
    <div
      class="mx-auto flex w-full max-w-6xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6"
    >
      <a
        class="w-fit rounded-sm text-xl font-bold tracking-tight text-indigo-950 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-indigo-700"
        routerLink="/dashboard"
      >
        IssueFlow
      </a>

      <nav aria-label="Navegación principal" class="flex flex-wrap gap-2">
        <a
          class="inline-flex min-h-11 items-center rounded-md px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700"
          routerLink="/dashboard"
          routerLinkActive="bg-indigo-50 text-indigo-900"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          Panel
        </a>
        <a
          class="inline-flex min-h-11 items-center rounded-md px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700"
          routerLink="/issues"
          routerLinkActive="bg-indigo-50 text-indigo-900"
          ariaCurrentWhenActive="page"
        >
          Incidencias
        </a>
      </nav>
    </div>
  </header>

  <main
    id="main-content"
    class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 sm:py-12"
    #mainContent
    tabindex="-1"
  >
    <router-outlet (activate)="focusMainContentAfterNavigation()" />
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto w-full max-w-6xl px-4 py-4 text-sm text-slate-600 sm:px-6">
      IssueFlow · Gestión local de incidencias
    </div>
  </footer>
</div>
